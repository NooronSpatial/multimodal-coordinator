# The iOS demo project (Phase 2 slice deliverable — SPEC §6, D-017).
# Regenerate with: cd Demo/TranscribeDemo && xcodegen
# Dev tooling only (D-016 tier 4); the generated .xcodeproj is committed so
# the demo opens with one click.
name: TranscribeDemo
options:
  bundleIdPrefix: dev.nooron
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  multimodal-coordinator:
    path: ../..
targets:
  TranscribeDemo:
    type: application
    platform: iOS
    sources:
      - Sources
      # The committed bake-off fixtures ride inside the app, so the phone
      # measures EXACTLY the same audio as the Mac (AC-43).
      - path: ../../Fixtures/ryad-en.wav
        buildPhase: resources
      - path: ../../Fixtures/bakeoff-reference.txt
        buildPhase: resources
    # SwiftLint while you type (Ryad's ruling 3 = B). It runs after the
    # compile, warns rather than fails, and does NOTHING when swiftlint is
    # not installed — a teammate without brew gets a hint, not a broken
    # build. CI is where the same rules are enforced strictly.
    postCompileScripts:
      - script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd "$SRCROOT/../.." && swiftlint lint --quiet
          else
            echo "warning: swiftlint not installed — brew install swiftlint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
    # THE MEMORY ENTITLEMENT (Ryad, 2026-09-03; D-086). The standard enabler
    # for on-device language models: it asks the kernel for a higher
    # per-process limit than the default, on devices that grant one. It
    # RAISES THE CEILING AND SHRINKS NOTHING — the 4B mind is still 2.2 GB
    # and the mouth still costs ~120 MB per second of audio — and how much
    # it raises it is device-dependent, so the proof is the app's own
    # headroom line before and after on the same phone: 884 MB with mind
    # and mouth resident was the "before". XcodeGen writes the
    # .entitlements file from `properties`; the file is committed so the
    # project opens with one click, like the .xcodeproj.
    entitlements:
      path: TranscribeDemo.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: multimodal-coordinator
        product: MultiModalKit
      - package: multimodal-coordinator
        product: MultiModalKitTesting
      - package: multimodal-coordinator
        product: MultiModalKitWhisper
      # The second mouth (4e). An OPT-IN product, so the demo asking for
      # it is exactly the shape D-045 F-4 intended: apps choose, the core
      # never learns that TTSKit exists.
      - package: multimodal-coordinator
        product: MultiModalKitTTS
      # The BENCH (4j). The phone's own measuring instruments —
      # BenchConfiguration, BenchConditions, the sweep. This line was
      # MISSING while the generated project carried the link anyway: the
      # .pbxproj and its source of truth had drifted, and regenerating
      # the project during the 2026-08-27 refactor is what exposed it.
      - package: multimodal-coordinator
        product: MultiModalKitBench
      # The second MIND (4h, D-062 F-1 = A). Opt-in for the same reason.
      # NOTE: MLX cannot run on the iOS SIMULATOR at all (D-061) — the
      # demo says so honestly rather than hiding the option (AC-131).
      - package: multimodal-coordinator
        product: MultiModalKitMLX
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # Ryad selects his team once in Xcode; nothing is hardcoded here.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The demo listens to the microphone to transcribe your speech — fully on this device, nothing leaves it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcription runs entirely on this device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
