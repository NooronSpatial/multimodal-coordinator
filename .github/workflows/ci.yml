name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    name: swift build & test (macOS)
    runs-on: macos-26   # SpeechAnalyzer needs the macOS 26 SDK (D-017)
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
